name = "agua-saladillo-api"
main = "src/index.js"
compatibility_date = "2026-08-19"

# Dominio público limpio, sumado como Route (no Custom Domain) para que
# conviva en la misma zona lemeit.ar junto con api.lemeit.ar/aq y
# api.lemeit.ar/emas. El *.workers.dev de arriba sigue funcionando igual,
# sin el prefijo /wq.
routes = [
  { pattern = "api.lemeit.ar/wq/*", zone_name = "lemeit.ar" }
]
# Wrangler apaga el *.workers.dev por defecto en cuanto hay "routes" en el
# archivo, a menos que se lo pida explícito acá.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "agua-saladillo"
database_id = "a1021d31-d0e3-4836-b6a4-84b90be26897"
